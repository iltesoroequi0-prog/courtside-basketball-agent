function plausibleSalary(club,player){const league=infoLeague(club.leagueId);let leagueMedian=(league.salary[0]+league.salary[1])*.5;let relative=player.overall-({1:79,2:65,3:53}[league.tier]+(club.leagueId==='USA1'?10:0));const ideal=clamp(leagueMedian*(0.56+relative*.032),league.salary[0],league.salary[1]*2.15);return Math.round(Math.min(ideal,clubWage(club)*1.35)/50)*50}
function canSign(p){return !p.myClient&&game.clients.length<(game.origin==='established'?25:15)}
function adjustRel(target,delta){target.rel=clamp((target.rel||0)+delta,-5,5)}
function badge(text,kind=''){return `<span class="badge ${kind}">${esc(text)}</span>`}
function formatWeek(){return `Settimana ${game.week} · ${game.year}/${String((game.year+1)%100).padStart(2,'0')}`}

 ${ui.modal?renderModal():''}${ui.detail?detailHTML():''}<div id="toast" role="status" aria-live="polite"></div>`;

function setupHTML(){return `<div class="setup-page"><div class="setup-art"><div class="brand setup-logo"><span class="brand-ball">◉</span><span><b>COURTSIDE</b><small>AGENT MANAGER</small></span></div><div class="court-illustration"><div class="court-circle"></div><div class="court-line"></div><div class="court-dot">●</div></div><div class="setup-tag">IL TUO CAMPIONATO INIZIA QUI</div><h1>Non giochi la partita.<br><em>Muovi il mercato.</em></h1><p>Scopri talenti, costruisci rapporti, tratta contratti. Diventa l'agente più influente del basket.</p><div class="hero-stats"><span>5 paesi</span><span>13 campionati</span><span>Club reali</span></div></div><div class="setup-form"><span class="eyebrow">NUOVA PARTITA</span><h2>Inizia la carriera</h2><p>Ogni agente ha una storia. Quale sarà la tua?</p><form id="new-game-form"><label class="form-label" for="agency">Nome agenzia</label><input class="field" id="agency" name="agency" placeholder="Es. Serra Sports Agency" maxlength="35" value="Serra Sports Agency" required><label class="form-label">Punto di partenza</label><div class="choice-stack"><label class="choice"><input type="radio" name="origin" value="rookie" checked><span class="choice-visual">🌱</span><span><b>Agente sconosciuto</b><small>0 €, nessun giocatore, reputazione da costruire</small></span><span class="radio-mark"></span></label><label class="choice"><input type="radio" name="origin" value="established"><span class="choice-visual">🏆</span><span><b>Agente affermato</b><small>1.000.000 €, clienti, scout e contatti iniziali</small></span><span class="radio-mark"></span></label></div><label class="form-label">Visibilità delle valutazioni</label><div class="choice-row"><label class="mini-choice"><input type="radio" name="visibility" value="classic" checked><span><b>Classica</b><small>Overall visibile</small></span></label><label class="mini-choice"><input type="radio" name="visibility" value="realistic"><span><b>Realistica</b><small>Conta il giudizio scout</small>< function scoutsHTML(){let hired=game.scouts;const activeReports=game.reports.slice().reverse();return `<div class="section-head"><div><span class="eyebrow">L'OCCHIO DELL'AGENZIA</span><h2>Centro scouting</h2><p>Gli scout migliori sbagliano meno. La fiducia si costruisce lavorando insieme.</p></div></div><div class="split-grid"><section class="panel"><div class="panel-title"><div><span class="eyebrow">PERSONALE</span><h3>I miei osservatori</h3></div>${badge(`${hired.length} scout`,'lime')}</div>${hired.length?hired.map(s=>`<div class="scout-item"><span class="avatar scout-av">${esc(s.name.split(' ').map(x=>x[0]).join(''))}</span><div class="scout-data"><strong>${esc(s.name)}</strong><small>${esc(s.specialty)} · ${s.age} anni</small><div class="scout-meta">Precisione ${s.quality>=85?'Eccellente':s.quality>=65?'Buona':'Variabile'} · Rapporto ${rel(s.rel)}</div>${s.assignment?`<small class="assignment">Osserva ${esc(playerOf(s.assignment.player)?.name||'giocatore')} · ${s.assignment.weeks} sett.</small>`:''}</div><div class="scout-side"><b>${money(s.salary)}/mese</b><button class="btn btn-outline small" data-action="scout-list" data-id="${s.id}" ${s.assignment?'disabled':''}>${s.assignment?'Occupato':'Assegna'}</button></div></div>`).join(''):`<p class="muted spaced">Non hai ancora ingaggiato scout.</p>`}</section><section class="panel"><div class="panel-title"><div><span class="eyebrow">MERCATO DEL PERSONALE</span><h3>Ingaggia uno scout</h3></div></div>${SCOUT_POOL.filter(t=>!hired.some(s=>s.name===t.name)).map((s,i)=>`<div class="hire-row"><span><strong>${esc(s.name)}</strong><small>${esc(s.specialty)} · ${s.age} anni · Accuratezza ${s.quality>=85?'Eccellente':s.quality>=65?'Buona':'Discreta'}</small></span><div><b>${money(s.salary)}<small>/mese</small></b><button class="btn btn-outline small" data-action="hire" data-id="${s.name}">Assumi</button></div></div>`).join('')||'<p class="muted">Hai assunto tutti gli scout disponibili.</p>'}</section></div><section class="pa function renderModal(){let m=ui.modal;if(m.type==='assign'){const p=playerOf(m.playerId),available=game.scouts.filter(s=>!s.assignment);return `<div class="overlay modal-overlay" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true"><button class="x-btn" data-action="close-modal">×</button><span class="eyebrow">INCARICO SCOUTING</span><h2>Osserva ${esc(p.name)}</h2><p class="muted">Scegli un osservatore. Riceverai il dossier dopo 1–3 settimane.</p>${available.length?available.map(s=>`<button class="option-row" data-action="assign-scout" data-id="${s.id}" data-player="${p.id}"><span><b>${esc(s.name)}</b><small>Accuratezza ${s.quality>=85?'Eccellente':s.quality>=65?'Buona':'Variabile'} · ${money(s.salary)}/mese</small></span><span>Assegna →</span></button>`).join(''):'<p class="muted spaced">Nessuno scout libero. Assumine uno nella sezione Scout.</p>'}<button class="btn btn-ghost modal-close" data-action="close-modal">Chiudi</button></div></div>`}
 if(m.type==='chooseClub'){const p=playerOf(m.playerId),clubs=game.clubs.filter(c=>{const l=infoLeague(c.leagueId);return l.country==='Italia'&&l.tier>=2}).slice(0,65);return `<div class="overlay modal-overlay" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true"><button class="x-btn" data-action="close-modal">×</button><span class="eyebrow">CONTATTA UNA SOCIETÀ</span><h2>Proponi ${esc(p.name)}</h2><p class="muted">Scegli il club. Un profilo adeguato alle sue esigenze aiuta la relazione.</p><div class="modal-list">${clubs.map(c=>`<button class="option-row" data-action="approach" data-id="${c.id}" data-player="${p.id}"><span><b>${esc(c.name)}</b><small>${esc(infoLeague(c.leagueId).name)} · Cerca ${esc(c.hiring)}</small></span>→</button>`).join('')}</div></div></div>`}
 if(m.type==='chooseClient'){const c=clubOf(m.clubId);return `<div class="overlay modal-overlay" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true"><button class="x-btn" data-action="close-modal">×</button><span class="eyebrow">PROPOSTA ALLA SOCIETÀ</span><h2>${esc(c.name)}</h2><p class="muted">Il club cerca soprattutto un ${esc(c.hiring.toLowerCase())}. Un giocatore compatibile aumenta la fiducia.</p>${game.clients.length?game.clients.map(id=>playerOf(id)).filter(Boolean).map(p=>`<button class="option-row" data-action="approach" data-id="${c.id}" data-player="${p.id}"><span><b>${esc(p.name)}</b><small>${esc(p.position)} · ${p.age} anni</small></span>→</button>`).join(''):'<p class="muted spaced">Prima devi rappresentare almeno un giocatore.</p>'}</div></div>`}
 if(m.type==='offer'){let o=game.offers.find(o=>o.id===m.id);if(!o)return '';let club=clubOf(o.clubId),p=playerOf(o.playerId),lg=infoLeague(club.leagueId);return `<div class="overlay modal-overlay" data-action="close-modal"><div class="modal offer-modal" role="dialog" aria-modal="true"><button class="x-btn" data-action="close-modal">×</button><span class="eyebrow">TRATTATIVA IN CORSO</span><h2>${esc(club.name)}</h2><p class="muted">Contratto per <b>${esc(p.name)}</b> · ${esc(lg.name)}</p><div class="negotiation-stat"><span>Rapporto club ${rel(club.rel)}</span><span>Rapporto giocatore ${rel(p.rel)}</span></div><div class="quote">“${esc(o.quote||'Possiamo discutere un accordo, purché resti compatibile con i nostri programmi.') }”<small>— Direzione sportiva</small></div><form id="offer-form"><input type="hidden" name="id" value="${o.id}"><div class="form-two"><label class="form-label">Stipendio mensile (${lg.currency})<input type="number" min="0" step="50" name="salary" class="field" value="${o.salary}" required></label><label class="form-label">Durata (mesi)<select class="field" name="months">${[9,12,18,24].map(n=>`<option value="${n}" ${o.months===n?'selected':''}>${n} mesi</option>`).join('')}</select></label></div><div class="form-two"><label class="form-label">Bonus promozione (${lg.currency})<input type="number" min="0" step="100" class="field" name="bonus" value="${o.bonus}" required></label><label class="form-label">Commissione agente (%)<select class="field" name="fee">${[5,7,8,10,12].map(n=>`<option value="${n}" ${o.fee===n?'selected':''}>${n}%</option>`).join('')}</select></label></div><label class="toggle-field"><input type="checkbox" name="housing" ${o.housing?'checked':''}><span>Alloggio pagato dalla società</span></label><div class="negotiation-actions"><button type="submit" class="btn btn-primary">Invia controproposta →</button><button type="button" class="btn btn-outline" data-action="accept-offer" data-id="${o.id}">Accetta proposta attuale</button></div></form><div class="dialogue"><span class="eyebrow">APPROCCIO PERSONALE</span><button data-action="dialogue" data-id="${o.id}" data-tone="friendly">🤝 Costruisci fiducia</button><button data-action="dialogue" data-id="${o.id}" data-tone="firm">💬 Trattativa decisa</button></div></div></div>`}
 return ''}
function finance(amount,label){game.cash+=amount;game.finance.unshift({amount,label,week:game.week,year:game.year})}
function signPlayer(id){const p=playerOf(id);if(!p||!canSign(p)){toast('Non puoi rappresentare questo giocatore.');return}
 const diff=game.reputation+(p.rel*7)+rand(0,55)+ (p.clubId?-8:12) - (p.overall-55)*1.1;
 if(diff<30){adjustRel(p,-1);addMsg(game,'Rappresentanza rifiutata',`${p.name} non è convinto del tuo progetto. Costruisci reputazione e prova più avanti.`,'bad');ui.detail=null;toast('Il giocatore ha rifiutato. Rapporto -1');return}
 p.myClient=true;game.clients.push(id);adjustRel(p,1);game.reputation=clamp(game.reputation+2,0,100);addMsg(game,'Nuovo assistito!',`${p.name}, ${p.position.toLowerCase()}, entra nella tua agenzia. Ora puoi proporlo alle squadre.`,'good');ui.detail=null;toast(`${p.name} è un tuo nuovo assistito!`)}
function hire(name){if(game.scouts.some(s=>s.name===name))return;const s=SCOUT_POOL.find(s=>s.name===name);if(!s)return;if(game.cash<s.salary){toast(`Servono almeno ${money(s.salary)} per assumere questo scout.`);return}
 const n={...s,id:'owned-'+rand(10000,99999),rel:0,assignment:null};game.scouts.push(n);finance(-s.salary,'Primo mese scout · '+s.name);addMsg(game,'Scout assunto',`${s.name} è entrato nella tua agenzia. Ora può iniziare le osservazioni.`,'good');toast(`${s.name} assunto!`)}
function scoutAssign(sid,pid){const s=scoutOf(sid),p=playerOf(pid);if(!s||s.assignment||!p)return;s.assignment={player:pid,weeks:rand(1,3)};adjustRel(s,1);ui.modal=null;ui.detail=null;toast(`Osservazione affidata a ${s.name}.`)}
function approach(cid,pid){const c=clubOf(cid),p=playerOf(pid);if(!c||!p||!p.myClient)return;ui.modal=null;ui.detail=null;
 const posMatch=c.hiring===p.position,levelFit=p.overall>=({1:70,2:57,3:47}[infoLeague(c.leagueId).tier] + (c.leagueId==='USA1'?12:0));
 const chance=(posMatch?43:13)+(levelFit?35:-15)+(c.rel*6)+(c.president.investment==='Ambizioso'?8:0);
 if(rand(0,100)>chance){if(!levelFit||!posMatch)adjustRel(c,-1);addMsg(game,'Proposta non accolta',`${c.name} non ritiene ${p.name} il profilo giusto per questo momento.`, 'bad');toast('Club non interessato. Riprova con un profilo adatto.');return}
 adjustRel(c,1);adjustRel(c.president,1);let base=plausibleSalary(c,p);let offer={id:'o-'+game.lastId++,clubId:cid,playerId:pid,salary:base,months:9,bonus:Math.round(base*.75/100)*100,housing:c.wealth==='Alto',fee:8,status:'pending',created:game.week,year:game.year,baseline:base,dialogueUsed:false,quote:posMatch?'Ci piace il profilo: è il ruolo che stavamo cercando.':'Il giocatore è interessante, parliamo di cifre.'};game.offers.push(offer);addMsg(game,'Nuova proposta',`${c.name} vuole trattare per ${p.name}: ${money(base,infoLeague(c.leagueId).currency)} mensili.`,'offer');ui.modal={type:'offer',id:offer.id};toast('Interesse concreto: il rapporto con il club migliora!')}
function getOfferValues(form){const v=Object.fromEntries(new FormData(form));return {salary:Math.max(0,Number(v.salary)||0),months:Number(v.months)||9,bonus:Math.max(0,Number(v.bonus)||0),fee:Number(v.fee)||8,housing:form.querySelector('[name=housing]').checked}}
function counterOffer(form){const id=form.querySelector('[name=id]').value,o=game.offers.find(o=>o.id===id);if(!o||o.status!=='pending')return;const c=clubOf(o.clubId),v=getOfferValues(form),player=playerOf(o.playerId),lg=infoLeague(c.leagueId);
 const affordability=v.salary<=clubWage(c)*1.42 ||(c.wealth==='Alto'&&v.salary<=clubWage(c)*2.15);
 const increase=v.salary/(o.baseline||1),bonusFactor=v.bonus/Math.max(100,o.baseline),factor=(v.housing?0.055:0)+(v.fee>10?.10:0)+(v.months>12?.045:0);
 const chance=90-(increase-1)*110-bonusFactor*14-factor*100+c.rel*4+(c.president.investment==='Ambizioso'?8:0);
 if(!affordability||increase>2.4){adjustRel(c,-1);o.quote='Non possiamo permetterci queste condizioni. Serve una proposta più contenuta.';toast('Offerta fuori budget. Il rapporto con il club peggiora.');return}
 if(rand(1,100)<=chance){Object.assign(o,v);o.quote='Le condizioni possono andare bene. Aspettiamo la vostra conferma.';adjustRel(c,1);adjustRel(player,1);addMsg(game,'Controproposta accolta',`${c.name} accetta le condizioni negoziate per ${player.name}. Ora puoi firmare.`,'good');toast('Controproposta accettata! Ora firma.');return}
 o.salary=Math.round((o.baseline+v.salary*.6)/50)*50;o.bonus=Math.round(v.bonus*.7/100)*100;o.housing=v.housing&&c.wealth!=='Basso';o.fee=Math.min(10,v.fee);o.months=v.months;o.quote='Queste sono le nostre condizioni riviste. Possiamo venirci incontro?';toast('Il club ha presentato una controfferta.');}
function acceptOffer(id){const o=game.offers.find(o=>o.id===id);if(!o||o.status!=='pending')return;const p=playerOf(o.playerId),c=clubOf(o.clubId),lg=infoLeague(c.leagueId);
 o.status='accepted';p.clubId=c.id;p.leagueId=c.leagueId;p.contract={salary:o.salary,months:o.months,bonus:o.bonus,housing:o.housing,fee:o.fee,startYear:game.year,startWeek:game.week};
 const fee=Math.round(o.salary*o.months*o.fee/100); // pagamento unico semplificato
 finance(fee,`Commissione contratto · ${p.name}`);adjustRel(c,1);adjustRel(c.president,1);adjustRel(p,1);game.reputation=clamp(game.reputation+3,0,100);
 addMsg(game,'Contratto firmato!',`${p.name} giocherà per ${c.name}. ${money(o.salary,lg.currency)}/mese per ${o.months} mesi. Commissione agenzia: ${money(fee,lg.currency)}.`,'good');ui.modal=null;toast(`Contratto firmato! Commissione ${money(fee,lg.currency)}`)}
function weekAdvance(){game.week++;
 for(const scout of game.scouts){if(scout.assignment){scout.assignment.weeks--;if(scout.assignment.weeks<=0){let p=playerOf(scout.assignment.player),error=Math.round((100-scout.quality)/6),estimate=clamp(p.overall+rand(-error,error),33,99);let comment=p.injury>=4?'Attenzione alla tenuta fisica.':p.work>=4?'Ottima attitudine al lavoro.':p.work<=2?'Impegno discontinuo in allenamento.':'Giocatore con margini di crescita.';
 game.reports.push({playerId:p.id,scout:scout.name,estimate:tierFor(estimate),comment,week:game.week,year:game.year});addMsg(game,'Report scouting pronto',`${scout.name} ha concluso l'osservazione di ${p.name}: ${tierFor(estimate)}. ${comment}`,'good');adjustRel(scout,1);scout.assignment=null;}}}
 for(const p of game.players){if(p.injured>0){p.injured--;continue}if(p.clubId&&Math.random()<.88){p.stats.gp++;let pts=clamp((p.overall-35)/3.5+rand(-6,8),0,38);p.stats.pts+=+pts.toFixed(1);p.stats.reb+=rnd(0,Math.max(1,p.height/32-2));p.stats.ast+=rnd(0,Math.max(1,p.position==='Playmaker'?8:4));p.stats.mins+=rand(11,35)}
 if(Math.random()<(p.injury*.0007))p.injured=rand(1,5);
 if(Math.random()<.08&&p.overall<p.potential&&p.work>=3)p.overall++;
 }
 if(game.week%2===0){for(const c of game.clubs){const odds=clamp((c.strength-28)/80,.17,.78);Math.random()<odds?c.wins++:c.losses++;}}
 if(game.week%4===0){const cost=game.scouts.reduce((sum,s)=>sum+s.salary,0);if(cost){finance(-cost,'Stipendi mensili scout');if(game.cash<0)addMsg(game,'Cassa in rosso',`La tua agenzia è sotto zero: valuta i costi degli scout.`, 'bad')}}
 for(const o of game.offers){if(o.status==='pending' && game.year===o.year&&game.week-o.created>4){o.status='expired';addMsg(game,'Offerta scaduta',`${clubOf(o.clubId).name} ha ritirato la proposta per ${playerOf(o.playerId).name}.`,'bad')}}
 if(Math.random()<.27&&game.clients.length){const p=pick(game.clients.map(playerOf).filter(Boolean)),co=pick(game.clubs.filter(c=>c.country==='Italia'&&c.leagueId!=='ITA1'));if(!game.offers.some(o=>o.status==='pending'&&o.playerId===p.id)){if(p.overall>50&&Math.random()<.45){let base=plausibleSalary(co,p);let o={id:'o-'+game.lastId++,clubId:co.id,playerId:p.id,salary:base,months:9,bonus:0,housing:co.wealth==='Alto',fee:8,status:'pending',created:game.week,year:game.year,baseline:base,dialogueUsed:false,quote:'Abbiamo seguito il tuo assistito, vogliamo parlarne.'};game.offers.push(o);addMsg(game,'Interesse dal mercato',`${co.name} ha inviato un'offerta per ${p.name}.`,'offer');}}}
 if(game.week>40){completeSeason()}
 addMsg(game,'Settimana completata',`La simulazione del mondo è avanzata. Prestazioni, osservazioni, contratti e rapporti sono stati aggiornati.`,'system');ui.detail=null;ui.modal=null;toast('Settimana completata. Controlla le novità!')}
function completeSeason(){for(const p of game.players){if(p.clubId){const c=clubOf(p.clubId);p.history.push({year:game.year,team:c?.name||'Sconosciuta',league:p.leagueId,...p.stats});p.history=p.history.slice(-20)}p.stats={gp:0,pts:0,reb:0,ast:0,mins:0};p.age++;if(p.contract){p.contract.months-=9;if(p.contract.months<=0)p.contract=null;}}
 for(const c of game.clubs){c.wins=0;c.losses=0;c.budget=Math.round(c.budget*(.94+Math.random()*.14));if(Math.random()<.07)c.coach={name:nm(),age:rand(35,63),rel:0};if(Math.random()<.005)c.president={...mkPerson(),patience:rand(1,5),investment:pick(['Prudente','Equilibrato','Ambizioso']),rel:0};}
 game.reputation=clamp(game.reputation+Math.min(3,Math.floor(game.clients.length/4)),0,100);game.year++;game.week=1;game.offers=game.offers.map(o=>({...o,status:o.status==='pending'?'expired':o.status}));addMsg(game,'Nuova stagione!',`Benvenuto nella stagione ${game.year}/${game.year+1}. Lo storico di ogni giocatore è stato aggiornato.`,'good');}
function dialogue(id,tone){const o=game.offers.find(o=>o.id===id);if(!o||o.dialogueUsed){toast('Hai già usato un approccio personale in questa trattativa.');return}o.dialogueUsed=true;let c=clubOf(o.clubId);if(tone==='friendly'){adjustRel(c,1);adjustRel(c.president,1);o.quote='Apprezziamo la trasparenza, continueremo a parlare.';toast('Il rapporto con il club migliora (+1).')}else{if(Math.random()<.55){o.baseline=Math.round(o.baseline*1.08);o.quote='Capisco la tua richiesta. Possiamo fare uno sforzo.';toast('Hai ottenuto maggiore spazio economico!')}else{adjustRel(c,-1);o.quote='Non gradisco questo tono. Facciamo attenzione.';toast('Tono troppo duro: rapporto club -1.')}}}
function reset(){if(confirm('Vuoi davvero cancellare la tua carriera? Il salvataggio attuale andrà perso.')){localStorage.removeItem(stateKey);game=null;ui={tab:'home',country:'Italia',league:'all',position:'Tutti',search:'',detail:null,modal:null};render()}}
function clicked(action,id,btn){switch(action){case 'tab':ui.tab=id;ui.search='';ui.league='all';ui.detail=null;ui.modal=null;window.scrollTo(0,0);break;case 'player':ui.detail={type:'player',id};break;case 'club':ui.detail={type:'club',id};break;case 'close-detail':ui.detail=null;break;case 'close-modal':ui.modal=null;break;case 'sign-player':signPlayer(id);break;case 'hire':hire(id);break;case 'observe':if(!game.scouts.length){ui.detail=null;ui.tab='scouts';toast('Prima devi ingaggiare uno scout.');}else ui.modal={type:'assign',playerId:id};break;case 'scout-list':{const s=scoutOf(id);if(s&&!s.assignment){const selectable=game.players.filter(p=>!p.myClient&&!game.reports.some(r=>r.playerId===p.id)).slice(0,20);if(selectable.length){ui.modal={type:'assign',playerId:pick(selectable).id};toast('Seleziona uno scout oppure apri un giocatore specifico.')}}break;}case 'assign-scout':scoutAssign(id,btn.dataset.player);break;case 'offer-picker':ui.detail=null;ui.modal={type:'chooseClub',playerId:id};break;case 'offer-club':ui.detail=null;ui.modal={type:'chooseClient',clubId:id};break;case 'approach':approach(id,btn.dataset.player);break;case 'offer':ui.modal={type:'offer',id};break;case 'accept-offer':acceptOffer(id);break;case 'dialogue':dialogue(id,btn.dataset.tone);break;case 'read-all':game.messages.forEach(m=>m.read=true);break;case 'advance':weekAdvance();break;case 'reset':reset();return;default:return}
 save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||!game)return;const act=b.dataset.action;if((act==='close-modal'||act==='close-detail') && e.target!==b && b.classList.contains('overlay'))return;clicked(act,b.dataset.id,b)});
document.addEventListener('submit',e=>{if(e.target.getAttribute('id')==='new-game-form'){e.preventDefault();let f=new FormData(e.target);game=mkGame(f.get('agency'),f.get('origin'),f.get('visibility'));ui={tab:'home',country:'Italia',league:'all',position:'Tutti',search:'',detail:null,modal:null};save();render();toast('La tua carriera è iniziata!');}
 if(e.target.getAttribute('id')==='search-market'){e.preventDefault();ui.search=new FormData(e.target).get('search')||'';render();}
 if(e.target.getAttribute('id')==='offer-form'){e.preventDefault();counterOffer(e.target);save();render();}});
document.addEventListener('change',e=>{if(!game)return;if(e.target.id==='country-filter'){ui.country=e.target.value;ui.league='all';ui.search='';render();}if(e.target.id==='league-filter'){ui.league=e.target.value;render();}if(e.target.id==='position-filter'){ui.position=e.target.value;render();}});
init();
})();

</script></body></html>
